name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# One run per branch or PR: a newer push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 22 is the floor: `--test-coverage-lines` and `--test-coverage-exclude`
        # are Node 22 features, and the coverage step below depends on them. Node
        # 20 answers `bad option` and exits 9. `engines` says >=22 to match, and a
        # test in cli-ka-factory fails if the two ever disagree.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Tests run against the compiled output in dist/ (the `pretest` hook builds
      # first, so this also re-validates the build).
      - name: Test
        run: npm test

      # The guardrail from CONCEPT.md §8: no code on the line may be able to reach
      # a generative model. A violation fails the build, not a review.
      - name: No generative model on the line
        run: npm run lint:line

      # The determinism claim, checked on every push: every golden fixture must
      # re-extract from its frozen bytes to exactly the record that was frozen.
      # Each Land's goldens live in its own connector, so there is no single
      # fixture directory to point at any more.
      - name: Golden fixtures reproduce
        run: npm run goldens

      # The coverage floor: 80% of lines and functions across the workspace.
      - name: Coverage
        run: npm run coverage
